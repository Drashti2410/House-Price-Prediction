name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements-api.txt
      - run: python api/db.py
      - run: python api/model.py
      - run: pytest tests/
      - run: docker build -t house-price-api .
